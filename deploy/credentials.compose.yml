# Opt-in mount for the class-C8 credential key ring. Use together with the base file:
#   docker compose -f docker-compose.yml -f deploy/credentials.compose.yml ...
# The source file must be mode 0600 and must live outside the repository.

services:
  api:
    environment:
      HC_CREDENTIAL_KEY_FILE: /run/secrets/healthcurve-credential-keys.json
    volumes:
      - type: bind
        source: ${HC_CREDENTIAL_KEY_FILE_HOST:?set HC_CREDENTIAL_KEY_FILE_HOST}
        target: /run/secrets/healthcurve-credential-keys.json
        read_only: true

  worker:
    environment:
      HC_CREDENTIAL_KEY_FILE: /run/secrets/healthcurve-credential-keys.json
    volumes:
      - type: bind
        source: ${HC_CREDENTIAL_KEY_FILE_HOST:?set HC_CREDENTIAL_KEY_FILE_HOST}
        target: /run/secrets/healthcurve-credential-keys.json
        read_only: true
