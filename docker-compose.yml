# Local development stack (ADR-0002).
#
# Only `caddy` declares `ports:`. PostgreSQL and Redis are reachable by service name
# on the internal network and from nowhere else. The normal Mac runtime reaches
# host-native Ollama through Docker Desktop's private host bridge (ADR-0017).
#
# Images are pinned by digest so a silent upstream change cannot alter the runtime
# (threat model T6).

name: healthcurve-dev

x-restart: &restart
  restart: unless-stopped

services:
  caddy:
    build:
      context: .
      dockerfile: deploy/Caddy.Dockerfile
    <<: *restart
    ports:
      # Development defaults to loopback HTTP. Production must set the three
      # HC_CADDY_* values to its concrete Tailscale IPv4 and 443:443; CI rejects
      # wildcard, LAN, and non-Tailscale production bindings (ADR-0007).
      - "${HC_CADDY_BIND_IP:-127.0.0.1}:${HC_CADDY_HOST_PORT:-8080}:${HC_CADDY_CONTAINER_PORT:-80}"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks: [hc-internal]
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: report-runtime
    <<: *restart
    user: "10001:10001" # non-root (T6)
    environment:
      HC_ENVIRONMENT: dev
      HC_DATABASE_URL: postgresql+psycopg://healthcurve:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/healthcurve
      # Used only where model output becomes a draft (SAFE-15/16).
      HC_AI_DATABASE_URL: postgresql+psycopg://healthcurve_ai:${POSTGRES_AI_PASSWORD:?set POSTGRES_AI_PASSWORD}@postgres:5432/healthcurve
      # Host-native Ollama is the owner runtime so Apple Metal remains available and
      # large model storage is not duplicated in Docker. Must remain private.
      HC_OLLAMA_BASE_URL: ${HC_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      HC_OLLAMA_MODEL: ${HC_OLLAMA_MODEL:-qwen3:30b}
      HC_OLLAMA_VISION_MODEL: ${HC_OLLAMA_VISION_MODEL:-qwen3-vl:30b}
      HC_OLLAMA_CONNECT_TIMEOUT_S: ${HC_OLLAMA_CONNECT_TIMEOUT_S:-5}
      HC_OLLAMA_READ_TIMEOUT_S: ${HC_OLLAMA_READ_TIMEOUT_S:-60}
      HC_OLLAMA_MAX_RETRIES: ${HC_OLLAMA_MAX_RETRIES:-2}
      HC_OLLAMA_CONTEXT_WINDOW: ${HC_OLLAMA_CONTEXT_WINDOW:-24576}
      HC_OLLAMA_THINKING: ${HC_OLLAMA_THINKING:-false}
      HC_REDIS_URL: redis://redis:6379/0
      # The API receives only the non-secret feature flag/lookback so it can expose
      # owner controls. Garmin credentials and tokens are mounted only into the
      # isolated one-shot connector and Garmin worker (deploy/garmin.compose.yml).
      HC_GARMIN_ENABLED: ${HC_GARMIN_ENABLED:-false}
      HC_GARMIN_SYNC_LOOKBACK_DAYS: ${HC_GARMIN_SYNC_LOOKBACK_DAYS:-3}
      HC_GARMIN_SYNC_HOUR_LOCAL: ${HC_GARMIN_SYNC_HOUR_LOCAL:-12}
      HC_GARMIN_SYNC_INTERVAL_HOURS: ${HC_GARMIN_SYNC_INTERVAL_HOURS:-12}
      # Telegram (docs/telegram-setup.md). Passed through explicitly rather than via
      # env_file so database credentials do not leak into every container's
      # environment. Empty is fine -- the app treats unset as "not configured".
      HC_TELEGRAM_MODE: ${HC_TELEGRAM_MODE:-polling}
      HC_TELEGRAM_BOT_TOKEN: ${HC_TELEGRAM_BOT_TOKEN:-}
      HC_TELEGRAM_ALLOWED_CHAT_ID: ${HC_TELEGRAM_ALLOWED_CHAT_ID:-}
      HC_TELEGRAM_WEBHOOK_SECRET: ${HC_TELEGRAM_WEBHOOK_SECRET:-}
      HC_TELEGRAM_CONTEXT_TTL_MINUTES: ${HC_TELEGRAM_CONTEXT_TTL_MINUTES:-180}
      HC_TELEGRAM_CONTEXT_MAX_TURNS: ${HC_TELEGRAM_CONTEXT_MAX_TURNS:-12}
      HC_TELEGRAM_CONTEXT_MAX_CHARS: ${HC_TELEGRAM_CONTEXT_MAX_CHARS:-8000}
      HC_PUBLIC_BASE_URL: ${HC_PUBLIC_BASE_URL:-}
      HC_UPLOADS_DIR: /data/uploads
      HC_REPORT_ARTIFACTS_DIR: /data/reports
    volumes:
      - ${HC_UPLOADS_DIR:-./var/uploads}:/data/uploads
      - ${HC_REPORT_ARTIFACTS_DIR:-./var/reports}:/data/reports
    networks: [hc-internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # No `ports:` -- reachable only through caddy.

  document-worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: document-runtime
    <<: *restart
    user: "10001:10001"
    command: ["python", "-m", "healthcurve.document_worker"]
    environment:
      HC_UPLOADS_DIR: /data/uploads
      HC_DOCUMENT_POLL_INTERVAL_S: ${HC_DOCUMENT_POLL_INTERVAL_S:-2}
    volumes:
      - ${HC_UPLOADS_DIR:-./var/uploads}:/data/uploads
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 512m
    cpus: 1.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=0700

  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: runtime
    <<: *restart
    user: "10001:10001"
    command: ["python", "-m", "healthcurve.worker"]
    environment:
      HC_ENVIRONMENT: dev
      # Two roles, chosen per operation rather than per process (SAFE-15/16).
      # The worker also performs the owner's confirmation, which is a privileged
      # write, so the process cannot be restricted wholesale -- an earlier version
      # ran entirely as the AI role and could neither read identity.owner nor record
      # a confirmed dose.
      HC_DATABASE_URL: postgresql+psycopg://healthcurve:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/healthcurve
      # Used only where model output becomes a draft. Denied writes on fact and plan.
      HC_AI_DATABASE_URL: postgresql+psycopg://healthcurve_ai:${POSTGRES_AI_PASSWORD:?set POSTGRES_AI_PASSWORD}@postgres:5432/healthcurve
      # Same private host-native model endpoint used by the API (ADR-0017).
      HC_OLLAMA_BASE_URL: ${HC_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      HC_OLLAMA_MODEL: ${HC_OLLAMA_MODEL:-qwen3:30b}
      HC_OLLAMA_CONNECT_TIMEOUT_S: ${HC_OLLAMA_CONNECT_TIMEOUT_S:-5}
      HC_OLLAMA_READ_TIMEOUT_S: ${HC_OLLAMA_READ_TIMEOUT_S:-60}
      HC_OLLAMA_MAX_RETRIES: ${HC_OLLAMA_MAX_RETRIES:-2}
      HC_OLLAMA_CONTEXT_WINDOW: ${HC_OLLAMA_CONTEXT_WINDOW:-24576}
      HC_OLLAMA_THINKING: ${HC_OLLAMA_THINKING:-false}
      HC_REDIS_URL: redis://redis:6379/0
      # Telegram (docs/telegram-setup.md). Passed through explicitly rather than via
      # env_file so database credentials do not leak into every container's
      # environment. Empty is fine -- the app treats unset as "not configured".
      HC_TELEGRAM_MODE: ${HC_TELEGRAM_MODE:-polling}
      HC_TELEGRAM_CONTEXT_TTL_MINUTES: ${HC_TELEGRAM_CONTEXT_TTL_MINUTES:-180}
      HC_TELEGRAM_CONTEXT_MAX_TURNS: ${HC_TELEGRAM_CONTEXT_MAX_TURNS:-12}
      HC_TELEGRAM_CONTEXT_MAX_CHARS: ${HC_TELEGRAM_CONTEXT_MAX_CHARS:-8000}
      HC_TELEGRAM_BOT_TOKEN: ${HC_TELEGRAM_BOT_TOKEN:-}
      HC_TELEGRAM_ALLOWED_CHAT_ID: ${HC_TELEGRAM_ALLOWED_CHAT_ID:-}
      HC_TELEGRAM_WEBHOOK_SECRET: ${HC_TELEGRAM_WEBHOOK_SECRET:-}
      HC_PUBLIC_BASE_URL: ${HC_PUBLIC_BASE_URL:-}
      HC_BEADS_OUTBOX_DIR: /data/beads-outbox
      HC_BEADS_BACKLOG_EPIC_ID: ${HC_BEADS_BACKLOG_EPIC_ID:-hc-inbox}
    volumes:
      - ${HC_BEADS_OUTBOX_DIR:-./var/beads-outbox}:/data/beads-outbox
    networks: [hc-internal]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  cleanup-worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: runtime
    <<: *restart
    user: "10001:10001"
    command: ["python", "-m", "healthcurve.cleanup_worker"]
    environment:
      HC_ENVIRONMENT: dev
      HC_DATABASE_URL: postgresql+psycopg://healthcurve:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/healthcurve
      HC_UPLOADS_DIR: /data/uploads
      HC_REPORT_ARTIFACTS_DIR: /data/reports
    volumes:
      - ${HC_UPLOADS_DIR:-./var/uploads}:/data/uploads
      - ${HC_REPORT_ARTIFACTS_DIR:-./var/reports}:/data/reports
    networks: [hc-cleanup]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=10001,gid=10001,mode=0700
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    # postgres:16-alpine
    image: postgres@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    <<: *restart
    environment:
      POSTGRES_DB: healthcurve
      POSTGRES_USER: healthcurve
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      # Consumed by deploy/postgres-init to create the restricted AI role that
      # cannot write facts or plans (ADR-0001, SAFE-15/16).
      POSTGRES_AI_PASSWORD: ${POSTGRES_AI_PASSWORD:?set POSTGRES_AI_PASSWORD}
      # Optional until backups are configured. When set before first initialization,
      # deploy/postgres-init creates a dedicated read-only dump role. Existing volumes
      # use the same idempotent script manually; see the backup runbook.
      POSTGRES_BACKUP_PASSWORD: ${POSTGRES_BACKUP_PASSWORD:-}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    # hc-garmin is declared in the base topology even when its opt-in worker is
    # stopped. Otherwise a routine base-file update (for example rebuilding Caddy)
    # recreates PostgreSQL without the overlay-only network and silently strands the
    # already-running Garmin worker. No database port is published on this network.
    networks: [hc-internal, hc-cleanup, hc-garmin]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthcurve -d healthcurve"]
      interval: 5s
      timeout: 3s
      retries: 10
    # No `ports:` -- never reachable from the host or the internet (T2).

  redis:
    # redis:7-alpine -- durable shared abuse counters only; the job queue is in
    # PostgreSQL (ADR-0004). AOF + a named volume ensures restarting either the app
    # or Redis does not reset a security limit.
    image: redis@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    <<: *restart
    command: ["redis-server", "--save", "", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data
    networks: [hc-internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    # No `ports:`.

  ollama:
    # Explicit compatibility topology only. The owner runtime uses host-native
    # Ollama for Metal acceleration and does not start this service (ADR-0017).
    profiles: [container-ollama]
    image: ollama/ollama@sha256:b88c73ace3e115f8ec53dc8761ae1c0aabfa675406e3681786b98757ce050f42
    <<: *restart
    volumes:
      - ollama_models:/root/.ollama
    networks: [hc-internal]
    # No `ports:`.

networks:
  hc-internal:
    driver: bridge
  hc-cleanup:
    driver: bridge
    internal: true
  hc-garmin:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  ollama_models:
