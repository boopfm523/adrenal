name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # ADR-0006. The assert-runtime job fails the build if the interpreter differs.
  PYTHON_VERSION: "3.13"

jobs:
  quality:
    name: lint, types, boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.9"
          enable-cache: true

      - name: Install pinned dependencies
        run: uv sync --frozen --dev --extra documents

      - name: Assert the pinned runtime (ADR-0006)
        run: |
          uv run python -c "
          import sys
          assert sys.version_info[:2] == (3, 13), f'expected 3.13, got {sys.version}'
          print('runtime', sys.version)
          "

      - name: Lint
        run: |
          uv run ruff check src tests migrations
          uv run ruff format --check src tests migrations

      - name: Type check
        run: uv run pyright

      - name: Module boundaries (ADR-0002)
        run: uv run lint-imports

  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.9"
          enable-cache: true

      - run: uv sync --frozen --dev --extra documents

      # Runs the safety-rule coverage gate along with everything else: a rule marked
      # `enforced` in docs/safety-rules.yaml that has lost its test fails here.
      - name: Test
        run: uv run pytest --cov --cov-report=term-missing

      - name: Extraction regression baseline
        run: uv run python scripts/evaluate_extraction.py

  frontend:
    name: frontend contract, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.9"
          enable-cache: true

      - name: Install Python contract dependencies
        run: uv sync --frozen --dev

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install pinned frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Reject stale OpenAPI and generated types
        run: |
          uv run python scripts/export_openapi.py --check
          cd frontend && npm run check:api

      - name: Frontend lint, tests, and production build
        working-directory: frontend
        run: |
          npm run lint
          npm run test
          npm run build

      - name: Frontend dependency vulnerabilities
        working-directory: frontend
        run: npm audit --audit-level=high

  security:
    name: dependency and secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.9"
          enable-cache: true

      - run: uv sync --frozen --dev --extra documents

      - name: Dependency vulnerabilities (threat model T6)
        # Audit the lockfile rather than the environment: pip-audit cannot resolve
        # the editable local package, and the lock is what CI and production install.
        run: |
          uv export --format requirements-txt --no-emit-project --no-hashes \
            --all-groups --all-extras -o .audit-requirements.txt
          uv run pip-audit --strict -r .audit-requirements.txt

      - name: Secret scan (SAFE-29)
        run: |
          uv run detect-secrets scan --baseline .secrets.baseline \
            --exclude-files 'uv\.lock|\.beads/'
          uv run python scripts/check_secret_baseline.py

      - name: Refuse a committed .env (threat model T3)
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is committed; it must be git-ignored"
            exit 1
          fi

  compose:
    name: compose topology
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # ADR-0007: validate rendered development and production configurations. The
      # checker never reports environment values because they may contain secrets.
      - name: Only caddy publishes to loopback or Tailscale
        run: |
          POSTGRES_PASSWORD=ci-placeholder-not-a-secret \
          POSTGRES_AI_PASSWORD=ci-placeholder-not-a-secret \
          docker compose --env-file /dev/null config --format json > /tmp/healthcurve-dev.json
          python3 scripts/check_compose_topology.py /tmp/healthcurve-dev.json

          # Profiles are applied after interpolation. The scheduled Garmin worker
          # must therefore render after one-time credentials have been removed;
          # the connector itself performs the fail-closed credential check.
          POSTGRES_PASSWORD=ci-placeholder-not-a-secret \
          POSTGRES_AI_PASSWORD=ci-placeholder-not-a-secret \
          HC_GARMIN_TOKEN_STORE_HOST=/tmp/healthcurve-validation-garmin \
          docker compose --env-file /dev/null \
            -f docker-compose.yml -f deploy/garmin.compose.yml \
            --profile garmin config --format json > /tmp/healthcurve-garmin.json
          python3 scripts/check_compose_topology.py /tmp/healthcurve-garmin.json

          POSTGRES_PASSWORD=ci-placeholder-not-a-secret \
          POSTGRES_AI_PASSWORD=ci-placeholder-not-a-secret \
          HC_CADDY_BIND_IP=100.64.0.1 \
          HC_CADDY_HOST_PORT=443 \
          HC_CADDY_CONTAINER_PORT=443 \
          HC_TAILSCALE_DNS_NAME=machine.example-tailnet.ts.net \
          HC_TAILSCALE_CERT_DIR=/tmp/healthcurve-validation-certs \
          docker compose --env-file /dev/null \
            -f docker-compose.yml -f deploy/tailscale.compose.yml \
            config --format json > /tmp/healthcurve-prod.json
          python3 scripts/check_compose_topology.py --production /tmp/healthcurve-prod.json

      - name: Images are pinned by digest (threat model T6)
        run: |
          python3 - <<'PY'
          import pathlib, sys, yaml
          compose = yaml.safe_load(open("docker-compose.yml"))
          unpinned = [
              name for name, svc in compose["services"].items()
              if "image" in svc and "@sha256:" not in svc["image"]
          ]
          if unpinned:
              print(f"::error::images not pinned by digest: {unpinned}")
              sys.exit(1)
          caddy = compose["services"]["caddy"]
          if caddy.get("build", {}).get("dockerfile") != "deploy/Caddy.Dockerfile":
              print("::error::caddy must use the reviewed frontend build image")
              sys.exit(1)
          from_lines = [
              line for line in pathlib.Path("deploy/Caddy.Dockerfile").read_text().splitlines()
              if line.startswith("FROM ")
          ]
          if not from_lines or any("@sha256:" not in line for line in from_lines):
              print(f"::error::unpinned Caddy build stage: {from_lines}")
              sys.exit(1)
          print("all images pinned by digest")
          PY

      - name: Compose file is valid
        run: docker compose config --quiet
        env:
          POSTGRES_PASSWORD: ci-placeholder-not-a-secret
          POSTGRES_AI_PASSWORD: ci-placeholder-not-a-secret
